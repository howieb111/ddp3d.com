<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0B3350"/>
    </marker>
  </defs>
  <rect width="600" height="420" fill="#E8E4DD"/>
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#0B3350" font-weight="700">How to Measure</text>

  <!-- Panel A: front view, showing X -->
  <text x="150" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8C8880">Front view</text>
  <rect x="90" y="30" width="140" height="18" rx="3" fill="#8C8880" transform="translate(0 40)"/>
  <rect x="140" y="24" width="40" height="30" rx="6" fill="#C2542E" transform="translate(0 40)"/>
  <rect x="70" y="54" width="180" height="160" rx="14" fill="#C2542E" transform="translate(0 40)"/>
  <rect x="90" y="74" width="140" height="24" rx="4" fill="#0B3350" transform="translate(0 40)"/>
  <g transform="rotate(-6 150 105) translate(0 40)">
    <rect x="115" y="60" width="70" height="45" rx="4" fill="#E7F1FA" stroke="#0B3350" stroke-width="3"/>
  </g>
  <line x1="90" y1="280" x2="230" y2="280" stroke="#0B3350" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="160" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0B3350" font-weight="600">X — opening width</text>

  <!-- Panel B: side/cross-section view, showing Y (rail), Z (depth), Y (clearance) -->
  <text x="450" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8C8880">Side view (cross-section)</text>
  <rect x="380" y="70" width="40" height="18" fill="#8C8880"/>
  <line x1="365" y1="70" x2="365" y2="88" stroke="#0B3350" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="330" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0B3350" font-weight="600">Y</text>

  <rect x="380" y="94" width="140" height="160" rx="10" fill="#C2542E"/>
  <rect x="380" y="114" width="60" height="24" fill="#0B3350"/>

  <line x1="380" y1="290" x2="440" y2="290" stroke="#0B3350" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="410" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0B3350" font-weight="600">Z — depth</text>

  <line x1="460" y1="114" x2="460" y2="138" stroke="#0B3350" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="530" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0B3350" font-weight="600">Y</text>

  <text x="450" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8C8880">rail / ledge</text>

  <!-- legend -->
  <rect x="40" y="345" width="520" height="60" rx="8" fill="#ffffff" opacity="0.6"/>
  <text x="300" y="365" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0B3350">X = opening width &#8226; Y = rail/ledge thickness AND pocket clearance (shared value, 1/2" or 3/4") &#8226; Z = depth</text>
  <text x="300" y="385" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0B3350">Z over 4" adds $0.50/inch, capped at 7.5" &#8226; measure your rail/ledge (Y) before ordering</text>

  <text x="300" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8C8880" font-weight="600">PLACEHOLDER — Measurement Reference Diagram</text>
</svg>
